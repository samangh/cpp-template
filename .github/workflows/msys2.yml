name: MSYS2

on: [workflow_dispatch, pull_request, push]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{matrix.config.sys}}
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        config:
          - { sys: clang64 }
          # We don't use these, as GCC (as of v14.10 on 02/2025) has a bug when using semaphores,
          # see https://gcc.gnu.org/bugzilla/show_bug.cgi?id=104928
          # - { sys: mingw64 }
          # - { sys: ucrt64 }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{matrix.config.sys}}
          update: true
          pacboy: toolchain:p cmake:p boost:p SDL2:p fmt:p zstd:p openssl:p doxygen:p graphviz:p

      - name: Run CMake
        working-directory: ${{github.workspace}}
        run: |
             mkdir build
             cd build
             cmake .. -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=ON -DBUILD_DOCS=ON -DCMAKE_BUILD_TYPE=Release -DLIBSG_IMGUI_DIRECTX=ON -DLIBSG_IMGUI_OPENGL=ON

      - name: Build
        working-directory: ${{github.workspace}}/build
        run: MAKEFLAGS=-j$(nproc) cmake --build .

      - name: Install
        working-directory: ${{github.workspace}}/build
        run: cmake --install . --prefix ../prefix

      - name: Test
        working-directory: ${{github.workspace}}/build
        run: ctest --output-on-failure
